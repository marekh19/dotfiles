# Fix colors
set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm-ghostty:RGB'

# undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# underscore colours - needs tmux-3.0
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Default prefix (aka leader key) Ctrl + A
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Kill pane without confirm dialog
bind-key x kill-pane

# Make fzf theme available to tmux-fzf (run-shell doesn't inherit fish env)
set-environment -g FZF_DEFAULT_OPTS_FILE "$HOME/.config/fzf/fzf.conf"

# Replace native session picker with tmux-fzf session switcher
bind s run-shell -b "$HOME/.config/tmux/plugins/tmux-fzf/scripts/session.sh switch"

# Horizontal & Vertical splits
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Refresh tmux config
bind R source-file ~/.config/tmux/tmux.conf; display-message "Config reloaded!"

# Resize panes
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Zoom pane (maximize)
bind -r m resize-pane -Z

# Kill window without confirm dialog
bind-key & kill-window

# Window 1 based indexing
set -g base-index 1

# Renumber windows on window close
set -g renumber-windows on

# Enable mouse
set -g mouse on

# Clipboard
set -g set-clipboard on
# safety net so tmux knows ghostty can do OSC 52 clipboard
set -as terminal-features 'xterm-ghostty:clipboard'

# mouse: copy to system clipboard, keep scroll position
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# keyboard (prefix [): same behavior
bind -T copy-mode-vi y     send-keys -X copy-selection-no-clear
bind -T copy-mode-vi Enter send-keys -X copy-selection-no-clear

# Allow Shift+Enter to work (Kitty/Ghostty sends \e[13;2u for Shift+Enter)
bind -n S-Enter send-keys "\e[13;2u"

# Clear screen - with prefix
bind C-l send-keys 'C-l'

# Make left module wider so session name is not truncated (default length is 10)
set -g status-left-length 40

# tmux plugin manager
set -g @plugin 'tmux-plugins/tpm'

# tmux plugins
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'

# tmux-dotbar config
# meowsoot theme
set -g @tmux-dotbar-bg "#171616"          # bg_0 — matches terminal bg
set -g @tmux-dotbar-fg "#454240"          # bg_4 (border) — subtle inactive
set -g @tmux-dotbar-fg-current "#e2e0df"  # fg — active window
set -g @tmux-dotbar-fg-session "#eaa4c9"  # pink — most prominent accent
set -g @tmux-dotbar-fg-prefix "#cca6e7"   # lavender — second anchor, contrasts cleanly

set -g @tmux-dotbar-window-status-format " [#I] #W "

# meowsoot theme (pane borders, messages, mode, copy-mode, clock)
source-file ~/.config/tmux/meowsoot.tmux

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
